appId: fr.just-edit.ingesto
productName: ingesto
copyright: "Copyright © 2026 Just Edit"
compression: maximum
asar: true
# koffi ships a native .node binary that must live outside the asar archive to
# be loadable at runtime. It also ships one for SIXTEEN platforms in the same
# package (~62 MB), and none of them can be stripped by compression because they
# live outside the archive — so each platform below keeps only the binary it can
# actually run and drops the rest.
#
# GET THIS WRONG AND CACHE CONTROL FAILS SILENTLY: koffi falls back to "not
# available", verification quietly stops bypassing the OS cache, and nothing
# says so at runtime. Every build script therefore checks the packaged app for
# the expected koffi.node and REFUSES to report success if it is missing.
asarUnpack:
  - "**/node_modules/koffi/**"
directories:
  buildResources: build-resources
files:
  - src/**/*
  - package.json
  - build-resources/*.ico
  - build-resources/*.icns
  - build-resources/*.plist
  - "LICENSE"

mac:
  # Keep only the koffi binary this platform can run. koffi ships one for
  # 16 platforms (~62 MB) and they sit OUTSIDE the asar, so compression
  # cannot help. Written as an EXCLUSION and nothing else: for files under
  # node_modules, electron-builder keeps only the '!' patterns and silently
  # discards positive ones, so an exclude-all-then-re-include pair dropped
  # every binary — including the right one — and broke the build outright.
  files:
    - "!**/node_modules/koffi/build/koffi/!(darwin_arm64)/**"
  category: public.app-category.photography
  icon: build-resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64

dmg:
  title: "ingesto"
  writeUpdateInfo: false
  icon: null
  window:
    width: 540
    height: 400
  contents:
    - x: 150
      y: 160
      type: file
    - x: 390
      y: 160
      type: link
      path: /Applications
    - x: 270
      y: 320
      type: file
      path: "LICENSE"

linux:
  # Keep only the koffi binary this platform can run. koffi ships one for
  # 16 platforms (~62 MB) and they sit OUTSIDE the asar, so compression
  # cannot help. Written as an EXCLUSION and nothing else: for files under
  # node_modules, electron-builder keeps only the '!' patterns and silently
  # discards positive ones, so an exclude-all-then-re-include pair dropped
  # every binary — including the right one — and broke the build outright.
  files:
    - "!**/node_modules/koffi/build/koffi/!(linux_x64|musl_x64)/**"
  icon: build-resources/icons
  category: AudioVideo;Video;
  maintainer: "Just Edit <contact@just-edit.fr>"
  vendor: "Just Edit"
  synopsis: "Professional camera media ingest"
  description: "Checksum-verified offload of camera cards to one or more destinations, with MHL manifests, ingest reports and card tracking."
  desktop:
    entry:
      Name: ingesto
      Terminal: "false"
      Type: Application
      Categories: "AudioVideo;Video;Utility;"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
    - util-linux
    - udisks2

win:
  # Keep only the koffi binary this platform can run. koffi ships one for
  # 16 platforms (~62 MB) and they sit OUTSIDE the asar, so compression
  # cannot help. Written as an EXCLUSION and nothing else: for files under
  # node_modules, electron-builder keeps only the '!' patterns and silently
  # discards positive ones, so an exclude-all-then-re-include pair dropped
  # every binary — including the right one — and broke the build outright.
  files:
    - "!**/node_modules/koffi/build/koffi/!(win32_x64)/**"
  icon: build-resources/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  license: build-resources/license_en.txt
  installerLanguages:
    - en_US
    - fr_FR
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ingesto
