appId: fr.just-edit.syncto
productName: syncto
copyright: "Copyright © 2026 Just Edit"
compression: maximum
asar: true

# syncto's own code compiles nothing: hash-wasm is WebAssembly and ssh2 is
# JavaScript. But ssh2 declares TWO optional native modules — cpu-features and
# nan — and npm installs them whenever the machine happens to have a compiler,
# which every Mac with Xcode command line tools does.
#
# That is enough to break the Windows build from a Mac: electron-builder runs
# @electron/rebuild before packaging, @electron/rebuild finds cpu-features and
# tries to rebuild it for win32-x64, and node-gyp cannot cross-compile:
#
#   ⨯ node-gyp does not support cross-compiling native modules from source.
#
# Nothing needs rebuilding here, so the pass is turned off, and the two modules
# are kept out of the package below — otherwise a macOS .node binary would ship
# inside a Windows application. ssh2 loads perfectly without them (it wraps the
# require in a try/catch and falls back to its JavaScript implementation); it
# only loses a CPU-feature probe used to pick an accelerated cipher.
npmRebuild: false

directories:
  buildResources: build-resources
files:
  - src/**/*
  - package.json
  - version.json
  - build-resources/*.ico
  - build-resources/*.icns
  - build-resources/*.plist
  - "LICENSE"
  - "!node_modules/cpu-features/**"
  - "!node_modules/nan/**"

mac:
  category: public.app-category.utilities
  icon: build-resources/icon.icns
  darkModeSupport: true
  minimumSystemVersion: "11.0"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  # macOS asks the user before letting an app read a card, a NAS share or the
  # Desktop — and it shows THIS sentence in the prompt. Without one it shows a
  # blank, alarming dialog, and on some releases refuses outright. A folder
  # synchronizer lives on removable and network volumes, so every location it
  # can legitimately be pointed at gets a line that says why.
  extendInfo:
    NSRemovableVolumesUsageDescription: "syncto needs this to compare and copy files on cards and external drives."
    NSNetworkVolumesUsageDescription: "syncto needs this to compare and copy files on a NAS or a network share."
    NSDesktopFolderUsageDescription: "syncto needs this to synchronize a folder on your Desktop."
    NSDocumentsFolderUsageDescription: "syncto needs this to synchronize a folder in your Documents, and to write its reports there."
    NSDownloadsFolderUsageDescription: "syncto needs this to synchronize a folder in your Downloads."
  target:
    - target: dmg
      arch:
        - arm64

dmg:
  title: "syncto ${version}"
  writeUpdateInfo: false
  icon: null
  window:
    width: 540
    height: 400
  contents:
    - x: 150
      y: 160
      type: file
    - x: 390
      y: 160
      type: link
      path: /Applications
    - x: 270
      y: 320
      type: file
      path: "LICENSE"
  artifactName: "syncto-${version}-mac-${arch}.dmg"

win:
  icon: build-resources/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: syncto
  artifactName: "syncto-Setup-${version}.exe"

linux:
  icon: build-resources/icons
  category: Utility;
  maintainer: "Just Edit <contact@just-edit.fr>"
  vendor: "Just Edit"
  synopsis: "Folder comparison and synchronization"
  description: "Compare and synchronize folders with checksum-verified copies, versioning and detailed reports."
  target:
    - target: AppImage
      arch:
        - x64
