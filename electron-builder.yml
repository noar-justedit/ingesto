appId: fr.just-edit.ingesto
productName: ingesto
copyright: "Copyright © 2026 Just Edit"
compression: maximum
asar: true
directories:
  buildResources: build-resources
files:
  - src/**/*
  - package.json
  - build-resources/*.ico
  - build-resources/*.icns
  - build-resources/*.plist
  - "LICENSE"

mac:
  category: public.app-category.photography
  icon: build-resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64

dmg:
  title: "ingesto"
  writeUpdateInfo: false
  icon: null
  window:
    width: 540
    height: 400
  contents:
    - x: 150
      y: 160
      type: file
    - x: 390
      y: 160
      type: link
      path: /Applications
    - x: 270
      y: 320
      type: file
      path: "LICENSE"

linux:
  icon: build-resources/icons
  category: AudioVideo;Video;
  maintainer: "Just Edit <contact@just-edit.fr>"
  vendor: "Just Edit"
  synopsis: "Professional camera media ingest"
  description: "Checksum-verified offload of camera cards to one or more destinations, with MHL manifests, ingest reports and card tracking."
  desktop:
    entry:
      Name: ingesto
      Terminal: "false"
      Type: Application
      Categories: "AudioVideo;Video;Utility;"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
    - util-linux
    - udisks2

win:
  icon: build-resources/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  license: build-resources/license_en.txt
  installerLanguages:
    - en_US
    - fr_FR
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ingesto
